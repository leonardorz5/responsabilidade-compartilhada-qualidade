name: Testes de Qualidade

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes e coletar metricas
        run: python executar_qualidade.py

      - name: Exibir metricas
        if: always()
        run: |
          if [ -f metricas.json ]; then
            cat metricas.json
          fi